[package]
name = "unifia-voice-artifacts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pinned and integrity-checked Voice model artifact installation"

[dependencies]
futures-util = "=0.3.31"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "rt"] }
uuid = { version = "=1.19.0", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
