[package]
name = "unifia-knowledge-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Knowledge Core for the Unifia Sovereign Knowledge Core V1."

[lib]
name = "unifia_knowledge_core"
path = "src/lib.rs"

[features]
default = []
# SQLite + FTS5 is intentionally behind a feature flag. Phase 3
# wires the FTS schema and migrations. The crate compiles and
# tests pass without the feature; FTS-dependent code is gated.
sqlite = ["dep:rusqlite"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Path primitives (canonical, normalised).
# `camino` is a no_std-friendly UTF-8 path crate. We use it to
# avoid the cross-platform "non-UTF-8 path" footgun on Windows.
camino = { version = "1", features = ["serde1"] }
# Cryptographic hashing (BLAKE3 if available, SHA-256 fallback).
sha2 = "0.10"
blake3 = "1"
# Optional SQLite (Phase 3).
rusqlite = { version = "0.32", optional = true }

[dev-dependencies]
# Nothing yet; tests are file-based and use plain `#[test]`.
