[package]
name = "opencode-remote"
version = "0.1.0"
edition = "2021"
description = "Remote-only Android client for OpenCode"
license = "MIT"

[lib]
name = "opencode_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
