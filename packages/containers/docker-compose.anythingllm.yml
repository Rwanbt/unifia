# Docker Compose for running Unifia alongside AnythingLLM.
#
# Usage:
#   docker compose -f packages/containers/docker-compose.anythingllm.yml up
#
# Env vars:
#   UNIFIA_SERVER_PASSWORD - Server auth password
#   ANYTHING_LLM_API_KEY    - AnythingLLM API key (generate in Settings)
#
# After startup, configure unifia.json:
#   "experimental": {
#     "anythingllm": {
#       "enabled": true,
#       "url": "http://anythingllm:3001",
#       "api_key": "${ANYTHING_LLM_API_KEY}"
#     }
#   }

version: "3.8"

services:
  unifia:
    build:
      context: ../..
      dockerfile: packages/containers/base/Dockerfile
    ports:
      - "4096:4096"
    environment:
      - UNIFIA_SERVER_PASSWORD=${UNIFIA_SERVER_PASSWORD:-}
      - UNIFIA_HOSTNAME=0.0.0.0
    volumes:
      - unifia-data:/root/.opencode
      - ./workspace:/workspace
    working_dir: /workspace
    networks:
      - unifia-net

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    ports:
      - "3001:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
    volumes:
      - anythingllm-data:/app/server/storage
    networks:
      - unifia-net

volumes:
  unifia-data:
  anythingllm-data:

networks:
  unifia-net:
    driver: bridge
