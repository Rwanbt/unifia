[package]
name = "unifia-desktop"
version = "0.0.0"
description = "Unifia — open source AI coding agent"
# The fork's own crate metadata. Upstream authorship and copyright are recorded
# in LICENSE, which is where the attribution obligation lives; leaving them here
# would credit this fork's changes to a project that did not make them.
authors = ["Rwanbt"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unifia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray", "dep:bincode"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["macos-private-api", "protocol-asset"] }
# Devtools intentionally NOT in default features. Tauri enables the webview
# devtools automatically in debug builds; omitting the `devtools` feature
# here means release builds do NOT ship the devtools surface, which would
# otherwise let an XSS foothold attach to `__TAURI__` IPC in production.
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2.4.6"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = { version = "2.5.6", features = ["dangerous-settings"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["process", "rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
listeners = "0.3"
tauri-plugin-os = "2"
futures = "0.3.31"
semver = "1.0.27"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
uuid = { version = "1.19.0", features = ["v4"] }
tauri-plugin-decorum = "1.1.1"
comrak = { version = "0.50", default-features = false }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
dirs = "6.0.0"
# B1 (Sprint 4) — OS keychain for auth token storage.
#   - apple-native      : Security.framework (macOS)
#   - windows-native    : wincred (Windows)
#   - sync-secret-service + vendored : libsecret (Linux, vendored openssl-sys)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"], optional = true }
bincode = { version = "2.0", features = ["std", "derive", "serde"], optional = true }
ndarray = { version = "0.16.1", optional = true }
hound = "3.5.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
tokio-stream = { version = "0.1.18", features = ["sync"] }
process-wrap = { version = "9.0.3", features = ["tokio1"] }
rcgen = { version = "0.13", features = ["pem"] }
sha2 = "0.10"
base64 = "0.21"
url = "2"
unifia-kokoro-shared = { path = "../../../crates/unifia-kokoro-shared" }
unifia-supervisor = { version = "0.0.0", path = "../../../crates/unifia-supervisor" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_Registry"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"


[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta", rev = "591a5f3ddc78348abf4cbb541d599d65306d92b9" }
specta-typescript = { git = "https://github.com/specta-rs/specta", rev = "591a5f3ddc78348abf4cbb541d599d65306d92b9" }
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "6720b2848eff9a3e40af54c48d65f6d56b640c0b" }
# TODO: https://github.com/tauri-apps/tauri/pull/14812
tauri  = { git = "https://github.com/tauri-apps/tauri", rev = "4d5d78daf636feaac20c5bc48a6071491c4291ee" }
