# WHY: util/executable.ts trusted() canonicalises the program path and refuses a
# non-regular file; this pack declares it a command-injection barrier. Advanced
# setup never reads .github/codeql/extensions, so the analyze step hands this pack
# to run-queries through CODEQL_ACTION_EXTRA_OPTIONS.
name: unifia/javascript-models
version: 0.0.1
library: true
extensionTargets:
  codeql/javascript-all: "*"
dataExtensions:
  - "*.model.yml"
