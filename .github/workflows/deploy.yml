name: deploy

# WHY manual-only: this deploys upstream's SaaS (Cloudflare hostnames under
# opencode.ai, a Stripe webhook, PlanetScale branches) and this fork owns none
# of it. The former `push: [dev, production]` trigger meant merging the rebrand
# into `dev` would fire a deploy at infrastructure that is not ours. The fork
# publishes no site — see infra/stage.ts and PROD_READINESS.md G9.
on:
  workflow_dispatch:
    inputs:
      confirm_upstream_deploy:
        description: "Type 'yes' to confirm this deploys infrastructure the fork does not own"
        required: true
        default: "no"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Workaround for Pulumi version conflict:
      # GitHub runners have Pulumi 3.212.0+ pre-installed, which removed the -root flag
      # from pulumi-language-nodejs (see https://github.com/pulumi/pulumi/pull/21065).
      # SST 3.17.x uses Pulumi SDK 3.210.0 which still passes -root, causing a conflict.
      # Removing the system language plugin forces SST to use its bundled compatible version.
      # TODO: Remove when sst supports Pulumi >3.210.0
      - name: Fix Pulumi version conflict
        run: sudo rm -f /usr/local/bin/pulumi-language-nodejs

      - name: Install Pulumi Stripe provider without GitHub API rate limits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STRIPE_VERSION="0.0.28"
          STRIPE_PLUGIN_DIR="$HOME/.pulumi/plugins/resource-stripe-v${STRIPE_VERSION}"
          STRIPE_ARCHIVE="/tmp/pulumi-resource-stripe-v${STRIPE_VERSION}-linux-amd64.tar.gz"
          mkdir -p "$STRIPE_PLUGIN_DIR"
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://github.com/georgegebbett/pulumi-stripe/releases/download/v${STRIPE_VERSION}/pulumi-resource-stripe-v${STRIPE_VERSION}-linux-amd64.tar.gz" \
            --output "$STRIPE_ARCHIVE"
          tar -xzf "$STRIPE_ARCHIVE" -C "$STRIPE_PLUGIN_DIR"
          test -x "$STRIPE_PLUGIN_DIR/pulumi-resource-stripe"

      - name: Deploy
        if: inputs.confirm_upstream_deploy == 'yes'
        run: bun sst deploy --stage=${{ github.ref_name }}
        env:
          # Unlocks infra/stage.ts, which otherwise refuses to build a domain
          # this fork does not own.
          UNIFIA_ALLOW_UPSTREAM_DEPLOY: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_NAME: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_NAME }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          STRIPE_SECRET_KEY: ${{ github.ref_name == 'production' && secrets.STRIPE_SECRET_KEY_PROD || secrets.STRIPE_SECRET_KEY_DEV }}
        # SST may exit non-zero after a successful deploy due to post-deploy cleanup issues.
        # The deploy itself succeeds (✓ Complete) but orphan process cleanup can fail.
        continue-on-error: true

      - name: Verify deploy succeeded
        run: |
          echo "Deploy step completed. Check logs above for '✓ Complete' confirmation."
