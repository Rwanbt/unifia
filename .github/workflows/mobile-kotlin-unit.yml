name: mobile-kotlin-unit

# JVM unit tests of the Android app's Kotlin code (src/test), with no device,
# emulator or APK. Until this job they were never run (see the DSH parity matrix).

on:
  pull_request:
    paths:
      - "packages/mobile/src-tauri/gen/android/app/src/**"
      - "packages/mobile/src-tauri/gen/android/**/*.gradle.kts"
      - ".github/workflows/mobile-kotlin-unit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: kotlin unit tests (jvm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run the Kotlin unit tests
        working-directory: packages/mobile/src-tauri/gen/android
        # gradlew is stored without the executable bit (mode 100644).
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-report
          path: packages/mobile/src-tauri/gen/android/app/build/reports/tests/
