name: nix-hashes

# Owner decision B (2026-10-16, #748): this workflow COMPUTES the
# node_modules hashes on native runners and publishes them as artifacts
# with provenance. It never writes to a branch. The previous version held
# `contents: write` and pushed `nix/hashes.json` straight to `dev`/`beta`
# through the GitHub App, which the decision forbids. Adoption of the
# hashes is a reviewed PR to `dev` (see the run summary this workflow
# writes), and `nix build` must pass at the retained SHA.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [dev, beta]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
      - "flake.lock"
      - "nix/node_modules.nix"
      - "nix/scripts/**"
      - "patches/**"
      - ".github/workflows/nix-hashes.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native runners required: bun install cross-compilation flags (--os/--cpu)
  # do not produce byte-identical node_modules as native installs.
  compute-hash:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - system: aarch64-linux
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34

      - name: Compute node_modules hash
        id: hash
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          BUILD_LOG=$(mktemp)
          trap 'rm -f "$BUILD_LOG"' EXIT

          # Build with fakeHash to trigger hash mismatch and reveal correct hash
          nix build ".#packages.${SYSTEM}.node_modules_updater" --no-link 2>&1 | tee "$BUILD_LOG" || true

          # Extract hash from build log with portability
          HASH="$(nix run --inputs-from . nixpkgs#gnugrep -- -oP 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' "$BUILD_LOG" | tail -n1 || true)"

          if [ -z "$HASH" ]; then
            echo "::error::Failed to compute hash for ${SYSTEM}"
            cat "$BUILD_LOG"
            exit 1
          fi

          echo "$HASH" > hash.txt
          echo "Computed hash for ${SYSTEM}: $HASH"

      # Provenance: what produced this hash, so the adoption review can
      # check it against the SHA it cites instead of trusting a bare value.
      - name: Record provenance
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          # macOS has shasum, Linux has sha256sum; either names the lockfile
          # the hash was computed from.
          LOCK_SHA="$( (sha256sum bun.lock 2>/dev/null || shasum -a 256 bun.lock) | cut -d' ' -f1)"

          {
            echo "system=${SYSTEM}"
            echo "git-sha=${GITHUB_SHA}"
            echo "git-ref=${GITHUB_REF_NAME}"
            echo "bun-lock-sha256=${LOCK_SHA}"
            echo "nix=$(nix --version | head -n1)"
            echo "bun=$(nix eval --raw --inputs-from . nixpkgs#bun.version)"
            echo "runner-os=${RUNNER_OS}"
            echo "runner-arch=${RUNNER_ARCH}"
            echo "run-id=${GITHUB_RUN_ID}"
            echo "run-attempt=${GITHUB_RUN_ATTEMPT}"
          } > provenance.txt

          cat provenance.txt

      - name: Upload hash and provenance
        uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.system }}
          path: |
            hash.txt
            provenance.txt
          retention-days: 7

  # No branch is written here: the job only assembles the computed hashes
  # into one proposed file, keeps the provenance, and writes the adoption
  # steps into the run summary.
  propose-hashes:
    needs: compute-hash
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download hash artifacts
        uses: actions/download-artifact@v4
        with:
          path: hashes
          pattern: hash-*

      - name: Assemble proposed hashes and provenance
        run: |
          set -euo pipefail
          EXPECTED_LOCK_SHA="$( (sha256sum bun.lock 2>/dev/null || shasum -a 256 bun.lock) | cut -d' ' -f1)"
          export EXPECTED_LOCK_SHA
          bash nix/scripts/propose-hashes.sh

      - name: Upload proposed hashes
        uses: actions/upload-artifact@v4
        with:
          name: nix-hashes-proposed
          path: proposed/
          if-no-files-found: error
          retention-days: 7

      - name: Adoption steps
        run: |
          {
            echo "### Nix hashes — proposed, not pushed"
            echo ""
            echo "This workflow does not write to any branch (owner decision B, #748)."
            echo ""
            echo "To adopt these hashes:"
            echo "1. Run this workflow a second time; both runs must agree on every hash."
            echo "2. Download the \`nix-hashes-proposed\` artifact and review \`provenance.txt\` (git SHA, bun.lock sha256, Nix version, runner)."
            echo "3. Open a dedicated PR that updates \`nix/hashes.json\` with the values below."
            echo "4. \`nix build\` must pass at the retained SHA before the PR is merged."
            echo ""
            echo "Proposed \`nix/hashes.json\`:"
            echo '```json'
            cat proposed/nix-hashes-proposed.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
