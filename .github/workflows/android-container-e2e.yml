name: android-container-e2e

# Real end-to-end run of ADR-098 containers on an arm64 host: PRoot built from
# pinned sources, arm64 images pulled from Docker Hub, containers run through
# `unifia container`. See packages/unifia/script/container-e2e.sh.

on:
  pull_request:
    paths:
      - "packages/unifia/src/container/**"
      - "packages/unifia/src/cli/cmd/container.ts"
      - "packages/unifia/script/container-e2e.sh"
      - "packages/mobile/scripts/build-proot.sh"
      - ".github/workflows/android-container-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: container e2e (linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run the container flow
        working-directory: packages/unifia
        run: |
          mkdir -p "$RUNNER_TEMP/container-e2e"
          bash script/container-e2e.sh "$RUNNER_TEMP/container-e2e"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-e2e-report
          path: ${{ runner.temp }}/container-e2e/report.md
