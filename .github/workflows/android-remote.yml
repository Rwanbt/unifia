name: Android Remote APK (development)

on:
  push:
    branches:
      - feat/upstream-android-remote
    paths:
      - .github/workflows/android-remote.yml
      - bun.lock
      - packages/mobile/**
      - packages/app/**
      - packages/ui/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout development branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and build platform
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Network security tests
        working-directory: packages/mobile
        run: bun run test

      - name: Build Android debug APK
        working-directory: packages/mobile
        run: bunx tauri android build --target aarch64 --debug

      - name: Verify APK and checksums
        run: |
          find packages/mobile/src-tauri/gen/android/app/build/outputs -name '*.apk' -print -exec sha256sum {} \;
          test -n "$(find packages/mobile/src-tauri/gen/android/app/build/outputs -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-remote-android-arm64-debug
          path: packages/mobile/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7
