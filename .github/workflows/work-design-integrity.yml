name: work-design-integrity

on:
  pull_request:
    branches: [dev]
    paths:
      - "packages/**"
      - "work_design/**"
      - "INTEGRATION.md"
      - "scripts/check-pr-size.sh"
      - "scripts/check-workbench-test-boundary.mjs"
      - ".github/workflows/work-design-integrity.yml"

permissions:
  contents: read

jobs:
  merge-and-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base
        # Full history on purpose. `git merge-tree` needs a merge base, and a
        # shallow fetch of `dev` grafts the tip as a root, so any PR whose base
        # is not already the fetched tip fails with "refusing to merge unrelated
        # histories" as soon as dev advances after the PR was opened. That is a
        # false negative, not a real merge conflict.
        run: git fetch origin dev

      - name: Check mergeability without mutating the checkout
        run: git merge-tree --write-tree origin/dev HEAD

      - name: Check card size
        run: bash scripts/check-pr-size.sh dev

      - name: Check whitespace
        run: git diff --check origin/dev...HEAD

      - name: Check Workbench security policy
        run: node scripts/check-workbench-security.mjs

      - name: Check Workbench test boundary
        run: node scripts/check-workbench-test-boundary.mjs
