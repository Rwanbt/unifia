name: work-design-integrity

on:
  pull_request:
    branches: [dev, dev_auto]
    paths:
      - "packages/**"
      - "work_design/**"
      - "INTEGRATION.md"
      - "scripts/check-pr-size.sh"
      - "scripts/check-workbench-test-boundary.mjs"
      - ".github/workflows/work-design-integrity.yml"

permissions:
  contents: read

jobs:
  merge-and-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact PR base
        # Use immutable event base SHA so comparisons remain valid when dev and
        # dev_auto diverge. Never derive the base from a stale branch ref.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          [[ "$BASE_REF" == "dev" || "$BASE_REF" == "dev_auto" ]] || exit 1
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Check mergeability without mutating the checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git merge-tree --write-tree "$BASE_SHA" HEAD

      - name: Check card size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-pr-size.sh "$BASE_SHA"

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

      - name: Check Workbench security policy
        run: node scripts/check-workbench-security.mjs

      - name: Check Workbench test boundary
        run: node scripts/check-workbench-test-boundary.mjs
