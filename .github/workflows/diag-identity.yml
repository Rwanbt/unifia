name: diag-identity
on:
  push:
    branches:
      - new-ui
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Capture identity fields in the swap window
        run: bun packages/unifia/script/diag-identity.ts