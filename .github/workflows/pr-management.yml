name: pr-management

on:
  pull_request_target:
    types: [opened]

jobs:
  check-duplicates:
    # WHY: upstream-only job. It also needs blacksmith runners, which is what left this
    # check queued forever on the fork (issue #59).
    #
    # A job-level `if:` is NOT enough, and that is the whole point of this change.
    # With the previous guard, GitHub still CREATED the job and queued it against
    # `blacksmith-4vcpu-ubuntu-2404` with runner_id=0 and steps=0, forever — measured on
    # PR #294 and across 12 consecutive pr-management runs, while the sibling job in
    # the same run finished in 2 s on ubuntu-latest. A false `if:` does not stop the run
    # being queued against its `runs-on` label; it only stops the STEPS from running.
    # So the job has to be schedulable here, and the fork guard moves into the steps.
    #
    # Result on this fork: the job schedules, the first step reports why there is
    # nothing to do, the remaining steps are skipped, and the check reports SUCCESS —
    # so it can be required and will never block a PR here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Nothing to do on a fork
        if: github.repository != 'anomalyco/opencode'
        run: echo "check-duplicates is upstream-only; skipping on ${{ github.repository }}"

      - name: Checkout repository
        if: github.repository == 'anomalyco/opencode'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check team membership
        id: team-check
        if: github.repository == 'anomalyco/opencode'
        run: |
          LOGIN="${{ github.event.pull_request.user.login }}"
          if [ "$LOGIN" = "unifia-agent[bot]" ] || grep -qxF "$LOGIN" .github/TEAM_MEMBERS; then
            echo "is_team=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: $LOGIN is a team member or bot"
          else
            echo "is_team=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: github.repository == 'anomalyco/opencode' && steps.team-check.outputs.is_team != 'true'
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        if: github.repository == 'anomalyco/opencode' && steps.team-check.outputs.is_team != 'true'
        run: bun install

      - name: Install unifia
        if: github.repository == 'anomalyco/opencode' && steps.team-check.outputs.is_team != 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Build prompt
        if: github.repository == 'anomalyco/opencode' && steps.team-check.outputs.is_team != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "Check for duplicate PRs related to this new PR:"
            echo ""
            echo "CURRENT_PR_NUMBER: $PR_NUMBER"
            echo ""
            echo "Title: $(gh pr view "$PR_NUMBER" --json title --jq .title)"
            echo ""
            echo "Description:"
            gh pr view "$PR_NUMBER" --json body --jq .body
          } > pr_info.txt

      - name: Check for duplicate PRs
        if: github.repository == 'anomalyco/opencode' && steps.team-check.outputs.is_team != 'true'
        env:
          UNIFIA_API_KEY: ${{ secrets.UNIFIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT=$(bun script/duplicate-pr.ts -f pr_info.txt "Check the attached file for PR details and search for duplicates")

          if [ "$COMMENT" != "No duplicate PRs found" ]; then
            gh pr comment "$PR_NUMBER" --body "_The following comment was made by an LLM, it may be inaccurate:_

          $COMMENT"
          fi

  add-contributor-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Add Contributor Label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const issueNumber = isPR ? context.payload.pull_request.number : context.payload.issue.number;
            const authorAssociation = isPR ? context.payload.pull_request.author_association : context.payload.issue.author_association;

            if (authorAssociation === 'CONTRIBUTOR') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['contributor']
              });
            }