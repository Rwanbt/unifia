# Unifia's release pipeline: CLI, desktop, Android, npm and the container
# image. Named `fork-release` until 2026-08-10 and triggered on `v*-fork*` — the
# naming a fork gives itself, not the naming a product gives itself. It replaced
# a stub `release.yml` that fired on the same tags and published an empty draft
# from paths (`dist/*`, `*.tar.gz` at the repo root) that no build produces.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.16)"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        type: boolean
        default: false
  push:
    tags:
      # `v*`, so plain `v1.3.16` releases — while still matching the `v*-fork*`
      # tags cut before the rename.
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ─── CLI (Linux x64 + Windows x64) ──────────────────────────────────
  build-cli:
    if: github.repository == 'Rwanbt/unifia'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Resolve version
        id: ver
        run: |
          RAW="${{ inputs.tag || github.ref_name }}"
          # strip leading v and trailing -fork* → x.y.z
          VER="${RAW#v}"
          VER="${VER%%-fork*}"
          # Must be semver-like; fallback to 0.0.0 if weird
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="0.0.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$RAW" >> "$GITHUB_OUTPUT"

      - name: Build CLI (cross-compile all targets via Bun)
        working-directory: packages/opencode
        # --all: build-cli runs once on ubuntu-latest but build-tauri needs both
        # linux and windows CLI binaries (see SIDECAR_BINARIES in
        # packages/desktop/scripts/utils.ts). Without --all, script/build.ts
        # defaults to the host target only (see the comment above singleFlag in
        # that script) and the windows artifact ends up empty.
        run: bun run script/build.ts --skip-embed-web-ui --all
        env:
          UNIFIA_VERSION: ${{ steps.ver.outputs.version }}
          UNIFIA_CHANNEL: latest

      - name: Package artifacts
        working-directory: packages/opencode/dist
        run: |
          set -e
          echo "dist contents:"
          ls -la
          # Linux x64 (glibc)
          if [ -d unifia-linux-x64 ]; then
            tar czf unifia-linux-x64.tar.gz -C unifia-linux-x64 .
          fi
          # Windows x64
          if [ -d unifia-windows-x64 ]; then
            (cd unifia-windows-x64 && zip -qr ../unifia-windows-x64.zip .)
          fi
          ls -lh *.tar.gz *.zip 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: cli-bundles
          path: |
            packages/opencode/dist/unifia-linux-x64.tar.gz
            packages/opencode/dist/unifia-windows-x64.zip
            install
          if-no-files-found: error

      # Every platform package, kept whole for the npm job below. The bundles
      # above are only the two the GitHub release carries.
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: packages/opencode/dist
          if-no-files-found: error

      # Second upload in the "unifia-cli" layout expected by
      # packages/desktop/scripts/prepare.ts (used by build-tauri below).
      - uses: actions/upload-artifact@v4
        with:
          name: unifia-cli
          path: |
            packages/opencode/dist/unifia-linux*
            packages/opencode/dist/unifia-darwin*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: unifia-cli-windows
          path: packages/opencode/dist/unifia-windows*
          if-no-files-found: warn

    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

  # ─── npm: unifia-ai + one package per platform ──────────────────────
  # Reuses the binaries build-cli already cross-compiled, so npm costs one job
  # rather than a second build matrix.
  publish-npm:
    needs: build-cli
    if: github.repository == 'Rwanbt/unifia'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: bun install

      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/opencode/dist

      - name: Restore executable bits
        # upload-artifact does not preserve the mode, and the stub's bin/ entry
        # has to stay executable for `npm i -g unifia-ai` to produce a runnable
        # command.
        run: chmod -R +x packages/opencode/dist packages/opencode/bin || true

      - name: Publish to npm
        run: bun packages/opencode/script/publish-npm.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          UNIFIA_VERSION: ${{ needs.build-cli.outputs.version }}
          UNIFIA_CHANNEL: latest

  # ─── Container image ────────────────────────────────────────────────
  publish-docker:
    needs: build-cli
    if: github.repository == 'Rwanbt/unifia'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/rwanbt/unifia, not upstream's ghcr.io/anomalyco/opencode: the
      # inherited script/publish.ts hardcodes the latter, which this fork has no
      # write access to and no business publishing under.
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unifia:${{ needs.build-cli.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/unifia:latest

  # ─── Tauri Desktop (Linux x64 + Windows x64, unsigned) ──────────────
  build-tauri:
    needs: build-cli
    if: github.repository == 'Rwanbt/unifia'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable 2025-05
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: fork-${{ matrix.settings.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install deps
        run: bun install

      - name: Prepare sidecar
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          UNIFIA_VERSION: 0.0.0-fork
          UNIFIA_CLI_ARTIFACT: ${{ (runner.os == 'Windows' && 'unifia-cli-windows') || 'unifia-cli' }}
          RUST_TARGET: ${{ matrix.settings.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build Tauri bundle (updater-signed, no OS code signing)
        working-directory: packages/desktop
        run: cargo tauri build --target ${{ matrix.settings.target }} --config ./src-tauri/tauri.prod.conf.json
        env:
          # tauri.prod.conf.json ships an updater public key, so Tauri hard-fails
          # without a matching private key even when OS-level code signing
          # (APPLE_*/AZURE_*) is skipped for this unsigned fork build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # packages/desktop/src-tauri/tauri.conf.json only targets
      # ["deb", "rpm", "dmg", "nsis", "app"] — AppImage/MSI are never produced,
      # so don't collect them (the release job used to require both and
      # hard-fail with "Pattern ... does not match any files").
      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          set -e
          OUT=packages/desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle
          mkdir -p dist-desktop
          cp "$OUT"/deb/*.deb dist-desktop/unifia-desktop-linux-x64.deb
          ls -lh dist-desktop/

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "packages/desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle"
          New-Item -ItemType Directory -Force dist-desktop | Out-Null
          Get-ChildItem "$out/nsis/*.exe" | Copy-Item -Destination "dist-desktop/unifia-desktop-windows-x64.exe"
          Get-ChildItem dist-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.settings.target }}
          path: dist-desktop/*
          if-no-files-found: error

  # ─── Android APK ────────────────────────────────────────────────────
  build-android:
    if: github.repository == 'Rwanbt/unifia'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3

      - name: Install Android NDK + CMake
        run: |
          rm -rf $ANDROID_HOME/ndk/* 2>/dev/null || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable 2025-05
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: packages/mobile/src-tauri
          cache-targets: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Download runtime binaries
        run: |
          JNIDIR="packages/mobile/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          ASSETS="packages/mobile/src-tauri/gen/android/app/src/main/assets/runtime"
          RUNTIME="packages/mobile/src-tauri/assets/runtime"
          mkdir -p "$JNIDIR" "$ASSETS" "$RUNTIME/node_modules/@parcel/watcher"

          curl -fsSL https://github.com/oven-sh/bun/releases/latest/download/bun-linux-aarch64-musl.zip -o /tmp/bun.zip
          unzip -o -q /tmp/bun.zip -d /tmp/bun-extract
          cp /tmp/bun-extract/bun-linux-aarch64-musl/bun "$JNIDIR/libbun_exec.so"

          ALPINE_INDEX="https://dl-cdn.alpinelinux.org/alpine/v3.21/main/aarch64"
          resolve_apk() {
            curl -fsSL "$ALPINE_INDEX/" \
              | grep -oE "$1-[0-9][0-9.]*-r[0-9]+\.apk" \
              | sort -uV | tail -1
          }

          MUSL_APK=$(resolve_apk "musl")
          curl -fsSL "$ALPINE_INDEX/$MUSL_APK" -o /tmp/musl.apk
          cd /tmp && tar -xzf musl.apk lib/ld-musl-aarch64.so.1
          cp /tmp/lib/ld-musl-aarch64.so.1 "$GITHUB_WORKSPACE/$JNIDIR/libmusl_linker.so"
          cd "$GITHUB_WORKSPACE"

          LIBSTDCPP_APK=$(resolve_apk "libstdc\+\+")
          LIBGCC_APK=$(resolve_apk "libgcc")
          curl -fsSL "$ALPINE_INDEX/$LIBSTDCPP_APK" -o /tmp/libstdcpp.apk
          curl -fsSL "$ALPINE_INDEX/$LIBGCC_APK" -o /tmp/libgcc.apk
          cd /tmp && tar -xzf libstdcpp.apk --wildcards 'usr/lib/libstdc++.so.6.*'
          cd /tmp && tar -xzf libgcc.apk usr/lib/libgcc_s.so.1
          cp /tmp/usr/lib/libstdc++.so.6.* "$GITHUB_WORKSPACE/$JNIDIR/libstdcpp_compat.so"
          cp /tmp/usr/lib/libgcc_s.so.1 "$GITHUB_WORKSPACE/$JNIDIR/libgcc_compat.so"
          cd "$GITHUB_WORKSPACE"

          curl -fsSL https://github.com/robxu9/bash-static/releases/latest/download/bash-linux-aarch64 -o "$JNIDIR/libbash_exec.so"

          RG_VERSION=$(curl -fsSL "https://api.github.com/repos/BurntSushi/ripgrep/releases/latest" | jq -r '.tag_name')
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-aarch64-unknown-linux-gnu.tar.gz" -o /tmp/rg.tar.gz
          tar -xzf /tmp/rg.tar.gz -C /tmp
          find /tmp -name "rg" -type f | head -1 | xargs -I{} cp {} "$JNIDIR/librg_exec.so"

          curl -fsSL "https://landley.net/toybox/bin/toybox-aarch64" -o "$JNIDIR/libtoybox_exec.so"

          NDK=$ANDROID_HOME/ndk/27.0.12077973
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang \
            -o "$JNIDIR/libpty_server.so" \
            packages/mobile/src-tauri/gen/android/pty_server.c \
            -O2 -Wall -Wextra -Wno-unused-parameter

          chmod 755 "$JNIDIR"/*

      - name: Build llama.cpp for Android
        run: |
          JNIDIR="packages/mobile/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          HEADERS="packages/mobile/src-tauri/gen/android/llama-headers"
          NDK=$ANDROID_HOME/ndk/27.0.12077973

          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          cmake -B /tmp/llama.cpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod+fp16" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod+fp16" \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -S /tmp/llama.cpp
          cmake --build /tmp/llama.cpp/build-android --config Release -j$(nproc)

          cp /tmp/llama.cpp/build-android/bin/libllama.so "$JNIDIR/"
          cp /tmp/llama.cpp/build-android/bin/libggml.so "$JNIDIR/"
          cp /tmp/llama.cpp/build-android/bin/libggml-base.so "$JNIDIR/"
          cp /tmp/llama.cpp/build-android/bin/libggml-cpu.so "$JNIDIR/"
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip "$JNIDIR"/libllama.so "$JNIDIR"/libggml*.so

          cmake -B /tmp/llama.cpp/build-static \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang \
            -DCMAKE_CXX_COMPILER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
            -DCMAKE_C_FLAGS="-march=armv8.2-a" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -S /tmp/llama.cpp
          cmake --build /tmp/llama.cpp/build-static --config Release --target llama-server -j$(nproc)
          cp /tmp/llama.cpp/build-static/bin/llama-server "$JNIDIR/libllama_server.so"
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip "$JNIDIR/libllama_server.so"

          mkdir -p "$HEADERS"
          cp /tmp/llama.cpp/include/*.h "$HEADERS/"
          cp /tmp/llama.cpp/ggml/include/*.h "$HEADERS/"

      - name: Bundle Unifia CLI
        run: |
          RUNTIME="packages/mobile/src-tauri/assets/runtime"
          ASSETS="packages/mobile/src-tauri/gen/android/app/src/main/assets/runtime"
          mkdir -p "$RUNTIME/node_modules/@parcel/watcher" "$ASSETS/node_modules/@parcel/watcher"
          node scripts/bundle-mobile.mjs --outdir "$RUNTIME"
          echo 'export function createWrapper() { return undefined }' > "$RUNTIME/node_modules/@parcel/watcher/wrapper.js"
          echo '{"name":"@parcel/watcher","version":"0.0.0","main":"wrapper.js"}' > "$RUNTIME/node_modules/@parcel/watcher/package.json"
          cp "$RUNTIME/opencode-cli.js" "$ASSETS/opencode-cli.js"
          cp -r "$RUNTIME/node_modules" "$ASSETS/"
          cp "$RUNTIME"/*.wasm "$ASSETS/" 2>/dev/null || true

      - name: Install Tauri CLI
        run: |
          bun add -g @tauri-apps/cli
          cargo install tauri-cli --version "^2" --locked || true

      - name: Build frontend
        working-directory: packages/mobile
        run: bun run build

      - name: Clear cargo config
        run: rm -f packages/mobile/src-tauri/.cargo/config.toml

      - name: Download ONNX Runtime for Android
        run: |
          ORT_VERSION="1.22.0"
          curl -fsSL "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar" -o /tmp/ort.aar
          cd /tmp && unzip -o ort.aar "jni/arm64-v8a/*"
          mkdir -p /tmp/ort-android
          cp /tmp/jni/arm64-v8a/libonnxruntime.so /tmp/ort-android/libonnxruntime.so
          echo "ORT_LIB_LOCATION=/tmp/ort-android" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV

      - name: Build APK
        working-directory: packages/mobile
        run: bunx tauri android build --target aarch64

      - name: Sign APK (debug keystore)
        run: |
          APK="packages/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          SIGNED="packages/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/unifia-mobile.apk"
          keytool -genkey -v \
            -keystore /tmp/ci.keystore \
            -alias unifia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Unifia CI, OU=Dev, O=Unifia, L=Paris, ST=IDF, C=FR"
          cp "$APK" "$SIGNED"
          java -jar "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/lib/apksigner.jar" sign \
            --ks /tmp/ci.keystore --ks-pass pass:android --key-pass pass:android \
            "$SIGNED"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: packages/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/unifia-mobile.apk
          if-no-files-found: error

  # ─── Create GitHub Release ──────────────────────────────────────────
  release:
    needs: [build-cli, build-tauri, build-android]
    if: github.repository == 'Rwanbt/unifia'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: cli-bundles
          path: ./release

      - uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-unknown-linux-gnu
          path: ./release

      - uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: ./release

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./release

      - name: List artifacts
        run: ls -lh ./release

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/install
            release/unifia-linux-x64.tar.gz
            release/unifia-windows-x64.zip
            release/unifia-desktop-linux-x64.deb
            release/unifia-desktop-windows-x64.exe
            release/unifia-mobile.apk
