# Release workflow for Unifia Workbench
# Triggers on tag push: v*.*.*
# Builds binaries, creates GitHub release, uploads artifacts

name: "Release"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: "Release ${{ github.ref_name || inputs.version }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun turbo build

      - name: Run tests
        run: bash tests/integration/run-all.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
            *.tar.gz
