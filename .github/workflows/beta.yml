name: beta

on:
  workflow_dispatch:
  # schedule trigger disabled: this syncs "beta"-labeled team PRs, which this
  # solo fork doesn't receive, and its blacksmith-4vcpu-ubuntu-2404 runner was
  # never migrated (see release.yml / build-tauri using ubuntu-latest),
  # so hourly runs queued forever without executing.
  # - cron: "0 * * * *"

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          unifia-app-id: ${{ vars.UNIFIA_APP_ID }}
          unifia-app-secret: ${{ secrets.UNIFIA_APP_SECRET }}

      - name: Install Unifia
        run: bun i -g unifia-ai

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          UNIFIA_API_KEY: ${{ secrets.UNIFIA_API_KEY }}
        run: bun script/beta.ts
