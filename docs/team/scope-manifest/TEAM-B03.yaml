  design_decisions:
    - "ModelInvoker never calls a real provider directly: callers inject a\
      \ ModelExecutor/ModelStreamExecutor. This is what keeps the invoker\
      \ deterministically testable (fake executors, zero network calls)\
      \ while still owning the real invocation contract: cancellation\
      \ (AbortSignal linking external signal + internal timeout controller),\
      \ retry/backoff (opt-in, default no-retry, transient-code allowlist\
      \ E_TIMEOUT/E_RATE_LIMIT/E_UNAVAILABLE, E_CANCELLED never retried),\
      \ and streaming (invokeStream is an async generator yielding\
      \ StreamChunk and returning the final InvocationResult via a\
      \ caller-supplied StreamAggregator, since the Output encoding is\
      \ generic and cannot be aggregated generically inside this module)."
    - "discoverAvailableProviders (B02) is consumed via an opt-in\
      \ availabilityCheck config on ModelInvoker: when enabled with\
      \ explicitParticipants it takes discovery's own explicit\
      \ short-circuit branch (>=2 explicit participants), which never\
      \ touches Provider.list()/Auth.all()/env/CLI — keeping this card's\
      \ own tests network-free while still genuinely wiring B02 into B03\
      \ (not just importing the type)."
    - "CostCatalog dependency-injection resolution: acceptance criteria\
      \ require BOTH 'CostCatalog reads C01, zero duplication' AND 'zero\
      \ import of model-intelligence/ from multi-model/'. Resolved by\
      \ having cost-catalog.ts accept a CostLookupFn (or a\
      \ costLookupFromRegistry(getModel) adapter built around a\
      \ structurally-typed RegistryModelLike/RegistryGetModelFn — a local\
      \ type mirror of C01's Model.pricing shape, NOT a re-import or a\
      \ second value table) as an injected parameter. Production wiring\
      \ that binds a real C01-backed lookup (e.g. unwrapping\
      \ Registry.getModel's Effect into a Promise) lives OUTSIDE\
      \ multi-model/, in a future integration/bootstrap card — this card\
      \ only defines the injection point and the adapter shape."
    - "usage-normalizer.ts reconciles OpenAI-style (promptTokens/\
      \ completionTokens) and Anthropic-style\
      \ (cacheReadInputTokens/cacheCreationInputTokens) field-naming\
      \ schemes into B01's single canonical TokenUsage shape, and computes\
      \ cost from injected CostRates (never fabricating a zero-cost result\
      \ for an unknown rate — returns null instead)."
