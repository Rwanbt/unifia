notes: |
  Risque CRITIQUE. TENSION ARCHITECTURALE DÉCOUVERTE PAR L'ORCHESTRATEUR (à
  résoudre par le worker, documentée pour lui éviter une redécouverte à l'aveugle) :

  Registry.sync() (registry.ts:158-206) EXISTE DÉJÀ mais est un stub incomplet :
  - Hardcodé sur UNE SEULE source (ModelsDevConnector), ignore complètement le
    connecteur générique C02 et le connecteur HTTP+snapshot C03.
  - `opts: SyncOptions` (force/staging/validate) est un paramètre NOMMÉ MAIS
    IGNORÉ (`(_opts) =>`) — aucune des 3 options n'a d'effet.
  - `manager.set(registry)` remplace l'état directement, sans zone de staging
    véritable ni validation pré-commit configurable.
  - `manager` (StorageManager) est une variable de closure PRIVÉE à
    makeLiveRegistryLayer — inaccessible depuis l'extérieur du fichier.

  registry.ts est GELÉ pour cette carte (jamais réécrit). Donc sync.ts ne peut
  PAS corriger le sync existant en place. Résolution recommandée (pattern DI,
  déjà validé et loué par un reviewer indépendant sur B03/cost-catalog.ts,
  cf. Execution/Reviews/B03-V2-E2-REVIEWER-VERDICT.md) : sync.ts doit exporter
  un moteur de synchronisation AUTONOME et INJECTABLE — construit sur sa PROPRE
  instance de StorageManager (importée de ./storage, pas celle du singleton Registry
  live) et sur les connecteurs (ModelsDevConnector, C02, C03) importés en lecture
  seule — qui implémente réellement staging + validation + commit atomique +
  rollback, sans jamais toucher registry.ts. Documenter explicitement dans le
  handoff : (a) pourquoi ce n'est pas un second registry (c'est un ENGINE, pas un
  stockage parallèle de vérité — même StorageBackend/schema que C01, juste une
  instance distincte tant que le singleton live n'est pas re-câblé, hors scope
  ici) ; (b) le chemin d'intégration future plausible (comment un jour brancher
  ce moteur sur le manager réel du Registry live, similaire à FU-1/FU-2 de B03)."
deviations_from_spec: |
  Followed the orchestrator's suggested resolution closely, with two additions
  found necessary while implementing, both documented in sync.ts's file-header
  comment and in the C07-attempt1.md handoff:
  1. `buildRegistry()`'s `registryID` (ingestion.ts:156) is a hash of
     {providers.length, models.length} only, NOT of actual content. Using it
     for no-op/rollback-proof detection would produce false positives/negatives
     (e.g. a pricing-only change with the same counts would hash identically).
     sync.ts computes its own content-level diff (`computeDiff`/`isDiffEmpty`)
     instead of relying on registryID for any correctness-relevant decision.
  2. `ingest()` (ingestion.ts:91-106, frozen) hardcodes the emitted `Source`
     record's license/copyright/licenseFileURL fields to models.dev's values
     regardless of which source produced the data. `mergeIngestResults()`
     corrects those 3 fields per source using the adapter's own already-
     validated license metadata (data already in hand, not reimplemented
     validation) — otherwise every non-models.dev source's Source record
     would carry misattributed license info.
  Also deliberately bypasses `StorageManager.set()` (storage.ts:75-78) for the
  commit step, calling the raw `StorageBackend.save()` directly, because
  `set()` mutates its in-memory `this.registry` BEFORE awaiting
  `backend.save()` — a latent bug in the frozen manager that would let a
  failed save() leave a stale in-memory cache pointing at unpersisted data.
  This is not a modification of storage.ts (untouched), just avoiding one of
  its documented-here-not-there code paths for the transactional commit.
