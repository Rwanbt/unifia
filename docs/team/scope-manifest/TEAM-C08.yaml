notes: |
  schema.ts:106-115 (C01, gelé) définit déjà l'enum LifecycleStage à 8 états :
  discovered -> metadata_validated -> probed -> low_risk_eligible ->
  general_eligible -> trusted_by_domain, plus deprecated/quarantined (états
  exceptionnels atteignables depuis n'importe quel état non-terminal). AUCUNE
  state machine gérant ces transitions n'existe encore. lifecycle.ts doit
  implémenter cette state machine (transitions valides/invalides, conditions de
  promotion). collections.ts doit gérer des collections dynamiques utilisateur
  (filtres versionnés, opt-in visible et explicite — jamais auto-trust silencieux).
deviations_from_spec: |
  1. [CORRECTED post-E2-review, see retry commit] `TransitionEvidence` carries
     NO timestamp field of any kind — neither `currentStageEnteredAtUTC` (removed
     in the original commit) NOR `nowUTC` (removed in the F1 retry commit, after
     independent E2 review proved the original claim below was incomplete).
     `LifecycleStore` takes a `clock: () => string` at construction (default
     `isoUtcNow`) and is the SOLE source of both the persisted `enteredAtUTC`
     and the evaluation instant used for every elapsed-time promotion condition.
     The original text of this entry (superseded, kept below struck through for
     the record) claimed the anti-spoofing fix was already complete after only
     removing `currentStageEnteredAtUTC`; E2 review (reproduced with probes)
     showed `evidence.nowUTC` — the *other* operand of the elapsed-time
     subtraction — was still an unvalidated, caller-supplied field, enabling
     (a) a far-future `nowUTC` promoting a model with 0ms real elapsed time,
     (b) that same caller value being persisted into the store's own
     "authoritative" `enteredAtUTC` and the audit log, and (c) a malformed
     `nowUTC` producing `NaN` elapsed time that silently satisfied every
     duration gate (`NaN < threshold` is `false`), i.e. fail-OPEN on bad input.
     Fixed by moving the clock to construction-time injection (this card's
     original preferred fix, per E2 review) and adding an explicit
     `Number.isFinite(elapsed)` fail-closed check (`pushElapsedGate`) as
     defense-in-depth against a misbehaving injected clock. See
     `lifecycle.ts`'s "Clock" module-doc section.
     ~~Original (superseded) text: `TransitionEvidence` does NOT carry
     `currentStageEnteredAtUTC` as originally drafted internally — the state
     machine (`LifecycleStore`) is authoritative about when a model entered
     its current stage ... A caller cannot spoof "this model has been in
     probation for 3 days".~~ — this last sentence was the inaccurate part;
     see above for what is actually now true.
  2. `lifecycle.ts` and `collections.ts` are intentionally NOT code-coupled
     (no import between them) despite being conceptually linked (an elevated
     collection opt-in is the natural trigger for a `grant_trust` explicit
     lifecycle action). Each is independently testable; the integration is
     documented in both files' module docs for the next integrator/orchestration
     layer to wire together.
  3. `deprecated` is reachable only from `low_risk_eligible`, `general_eligible`,
     `trusted_by_domain` — NOT from `discovered`/`metadata_validated`/`probed`.
     Rationale documented in lifecycle.ts module doc: "deprecated" means "was
     offered for use, now retired in favor of something else"; an onboarding
     model was never offered for use. Early-stage rejection uses `quarantined`
     instead, which remains reachable from every non-terminal stage including
     these three.
  4. `deprecated` and `quarantined` are terminal (zero outgoing transitions) —
     re-review of a rejected/retired model is modeled as a new record decision
     outside this module's scope, not a state-machine transition, to keep the
     graph acyclic and every stage's remaining transitions a structural fact.
