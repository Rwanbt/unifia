notes: |
  schema.ts:106-115 (C01, gelé) définit déjà l'enum LifecycleStage à 8 états :
  discovered -> metadata_validated -> probed -> low_risk_eligible ->
  general_eligible -> trusted_by_domain, plus deprecated/quarantined (états
  exceptionnels atteignables depuis n'importe quel état non-terminal). AUCUNE
  state machine gérant ces transitions n'existe encore. lifecycle.ts doit
  implémenter cette state machine (transitions valides/invalides, conditions de
  promotion). collections.ts doit gérer des collections dynamiques utilisateur
  (filtres versionnés, opt-in visible et explicite — jamais auto-trust silencieux).
deviations_from_spec: |
  1. `TransitionEvidence` does NOT carry `currentStageEnteredAtUTC` as originally
     drafted internally — the state machine (`LifecycleStore`) is authoritative
     about when a model entered its current stage (recorded at the previous
     transition, or at `initialize()`), and computes elapsed time from ITS OWN
     tracked value rather than trusting a caller-supplied timestamp. A caller
     accepting a spoofable "entered at" field would let probation/eligibility
     windows be bypassed by lying about elapsed time — closed before landing,
     not a deviation from the card's intent, but worth recording since the
     initial internal draft did carry that field on the evidence type.
  2. `lifecycle.ts` and `collections.ts` are intentionally NOT code-coupled
     (no import between them) despite being conceptually linked (an elevated
     collection opt-in is the natural trigger for a `grant_trust` explicit
     lifecycle action). Each is independently testable; the integration is
     documented in both files' module docs for the next integrator/orchestration
     layer to wire together.
  3. `deprecated` is reachable only from `low_risk_eligible`, `general_eligible`,
     `trusted_by_domain` — NOT from `discovered`/`metadata_validated`/`probed`.
     Rationale documented in lifecycle.ts module doc: "deprecated" means "was
     offered for use, now retired in favor of something else"; an onboarding
     model was never offered for use. Early-stage rejection uses `quarantined`
     instead, which remains reachable from every non-terminal stage including
     these three.
  4. `deprecated` and `quarantined` are terminal (zero outgoing transitions) —
     re-review of a rejected/retired model is modeled as a new record decision
     outside this module's scope, not a state-machine transition, to keep the
     graph acyclic and every stage's remaining transitions a structural fact.
