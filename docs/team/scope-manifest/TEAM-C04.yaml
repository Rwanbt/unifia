  design_decisions:
    - "PriceSnapshot construit sur les mêmes noms de champs que schema.ts::Pricing (currency/unit/input/output/cacheRead/cacheWrite/reasoning) mais AJOUTE validFrom/validTo/source/recordedAtUTC — jamais de prix sans bornes temporelles."
    - "Réutilise InvalidCurrencyError + InvalidPricingError (errors.ts, C01, import seul) pour la validation devise/champs numériques plutôt que de dupliquer un concept déjà possédé — DRY (une seule source par fait)."
    - "Nouvelles erreurs typées propres à ce module (non dupliquées ailleurs) : InvalidPriceSnapshotError (bornes temporelles/monotonie), StalePriceBlockedError, UnknownPriceBlockedError — via NamedError.create, même pattern que errors.ts."
    - "Stale policy : le flag stale n'est calculé que pour les lookups 'current' (atUTC omis) ; un lookup historique explicite (atUTC fourni) retourne toujours stale=false — répondre à une question sur le passé est correct par construction, ce n'est ni frais ni périmé."
    - "Risk enforcement : low/medium ne lèvent jamais — ils reçoivent le flag stale/unknown explicite (jamais de défaut silencieux) ; high/critical lèvent une erreur typée bloquante (StalePriceBlockedError / UnknownPriceBlockedError) sur les deux états."
    - "Devise ISO 4217 stricte : au-delà du pattern /^[A-Z]{3}$/ de schema.ts, ISO_4217_CODES est une allowlist explicite (~50 codes actifs) — un code de forme valide mais inexistant (ex. 'ZZZ') est rejeté."
    - "Bug découvert + corrigé pendant l'implémentation : lookupPrice utilisait isoUtcNow() (tronqué à la seconde) comme 'now' par défaut, ce qui pouvait rendre un snapshot tout juste enregistré avec un validFrom à la milliseconde près faussement 'pas encore applicable' jusqu'au prochain top de seconde. Fix : 'now' interne utilise new Date().toISOString() en pleine précision ; isoUtcNow() reste le format de stockage par défaut de validFrom (cohérent avec le reste du registry)."
  deviations_from_spec: none
  scope_respected: true

