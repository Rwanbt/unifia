deviations_from_spec: |
  Branded IDs use Zod's native `.brand<Tag>()` (a first-class Zod v4 feature)
  rather than the Effect-Schema-based ProviderID/ModelID pattern in
  provider/schema.ts. Rationale: that pattern is built on `effect`'s
  Schema.brand + a `withStatics` helper designed for Effect-Schema-first
  modules exposing a Zod interop shim; nothing in packages/unifia/src/team/**
  depends on `effect` today, and model-intelligence/schema.ts (the file this
  card was explicitly pointed at for versioning/error conventions) doesn't
  brand its own ids either (plain z.string().min(1)). Using Zod's own
  `.brand()` gives the same nominal-typing guarantee with zero new
  dependencies. Full reasoning documented in the file header of
  src/team/types.ts and in the D01-attempt1.md handoff.
  Schema versioning: re-derives (does not import) the
  model-intelligence/schema-version.ts + snapshot.ts pattern (semver
  SCHEMA_VERSION constant + major-version-only compare + typed
  UnsupportedSchemaVersionError-equivalent) as TEAM_SCHEMA_VERSION /
  TEAM_SCHEMA_VERSION_N_MINUS_1 / compareTeamSchemaVersion / TeamSchemaVersionError,
  scoped to the team domain per the "single canonical source per domain" rule
  and the forbidden cross-import from model-intelligence/**.
