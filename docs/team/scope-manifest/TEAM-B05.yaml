finding_summary: >
  Executed a byte-for-byte behavioral comparison between the current
  production adapter (src/collective/provider-discovery.ts, read-only) and
  a frozen pre-B02 oracle, under identical mocked Provider.list()/Auth.all()/
  credential-file/CLI-subprocess inputs. All cascade auth-method paths
  (api_key via env-var, api_key via stored auth, credential_file,
  cli_subprocess), ghost-model warnings, includeJudge, and selectJudge
  produce structurally identical results (verified via 22 executed tests,
  0 failures). Two cosmetic, provably-inert shape differences were found
  and characterized (own-key-presence of an undefined `role` field on
  explicit participants; key insertion order on the judge object) — neither
  affects any current Debate consumer (verified by reading every call
  site). One REAL regression was found and is NOT fixed here (out of
  scope): src/collective/provider-discovery.ts:131-132 wraps the
  substrate's Effect through `Effect.promise(() => Effect.runPromise(...))`,
  which reclassifies InsufficientProvidersError from a recoverable Effect
  Fail (pre-B02 behaviour) into an unrecoverable Effect Die/defect
  (current behaviour) — contradicting the adapter's own "Behaviour change:
  NONE" claim and silently invalidating the typed error channel declared
  at orchestrator.ts:49. Currently benign for all observed callers (none
  use Effect-level typed recovery on this error; all observe it via a
  rejected Promise, unaffected by Fail-vs-Die). See
  B05-attempt1.md / B05-BLOCKED.md for full detail.
