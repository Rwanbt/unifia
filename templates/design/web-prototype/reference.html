<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web prototype</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #111; }
      h1 { font-size: 24px; margin: 0 0 16px; }
      .card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; max-width: 480px; background: #fff; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      p.out { margin-top: 12px; color: #555; }
    </style>
  </head>
  <body>
    <h1>Web prototype</h1>
    <div class="card">
      <p>Click the button to see the prototype react.</p>
      <button id="btn">Click me</button>
      <p id="out" class="out">No click yet.</p>
    </div>
    <script>
      const btn = document.getElementById('btn');
      const out = document.getElementById('out');
      btn.addEventListener('click', () => {
        out.textContent = 'Clicked at ' + new Date().toLocaleTimeString();
      });
    </script>
  </body>
</html>
