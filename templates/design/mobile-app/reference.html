<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile app</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #111; min-height: 100vh; }
      header { background: #111; color: #fff; padding: 16px; }
      header h1 { font-size: 18px; margin: 0; }
      main { padding: 16px; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; margin-bottom: 8px; min-height: 44px; }
      nav { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid #e5e5e5; }
      nav button { background: transparent; border: 0; padding: 16px; min-height: 44px; cursor: pointer; }
    </style>
  </head>
  <body>
    <header><h1>Inbox</h1></header>
    <main>
      <ul>
        <li>Message from Alice</li>
        <li>Weekly summary ready</li>
        <li>Build finished</li>
        <li>Reminder: standup at 10</li>
      </ul>
    </main>
    <nav>
      <button>Inbox</button>
      <button>Today</button>
      <button>Search</button>
      <button>Me</button>
    </nav>
  </body>
</html>
